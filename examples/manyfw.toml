version = 1
default_action = "deny"

[zones.lan]
interfaces = ["eth0", "enp*"]
subnets = ["192.168.10.0/24"]

[zones.tailscale]
interfaces = ["tailscale0"]

[[rules]]
id = "postgres-tailscale"
source = "zone:tailscale"
destination = "docker:homelab/postgres"
ports = [5432]
protocol = "tcp"
action = "allow"
priority = 100

[[rules]]
id = "postgres-lan"
source = "zone:lan"
destination = "docker:homelab/postgres"
ports = [5432]
protocol = "tcp"
action = "allow"
priority = 100

[[rules]]
id = "vaultwarden-tailscale"
source = "zone:tailscale"
destination = "docker:homelab/vaultwarden"
ports = [8443]
protocol = "tcp"
action = "allow"
priority = 100
