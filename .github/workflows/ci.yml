name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: 1.85.0
            channel: 1.85.0
          - toolchain: stable
            channel: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ matrix.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --doc
      - run: cargo build --workspace --locked
      - run: cargo run -p manyfw -- check --file examples/manyfw.toml
      - name: Reject invalid policy fixtures
        shell: bash
        run: |
          set -euo pipefail
          for fixture in examples/invalid/*.toml; do
            if cargo run -p manyfw -- check --file "$fixture"; then
              echo "expected validation failure for $fixture" >&2
              exit 1
            fi
          done

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib

  fixtures:
    name: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo test -p manyfw-core --test recovery_matrix -- --nocapture
      - run: cargo test -p manyfw --test cli
      - name: Reject invalid policy fixtures
        shell: bash
        run: |
          set -euo pipefail
          for fixture in examples/invalid/*.toml; do
            if cargo run -p manyfw -- check --file "$fixture"; then
              echo "expected validation failure for $fixture" >&2
              exit 1
            fi
          done
      - name: Validate warning fixtures remain non-fatal
        run: cargo run -p manyfw -- check --file examples/warnings/broad-ports.toml
      - name: Validate recovery evidence contract
        run: python3 -m unittest scripts/test_validate_recovery_report.py

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
