name: Integration tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run recovery fixture matrix
        run: cargo test -p manyfw-core --test recovery_matrix -- --nocapture
      - name: Run CLI integration tests
        run: cargo test -p manyfw --test cli
